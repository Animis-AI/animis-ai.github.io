<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animis AI — The World Engine for Physical AI</title>
<meta name="description" content="Animis AI builds the world engine for physical AI.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Inter:wght@300..600&display=swap">
<style>
:root {
  --paper:#FAF9F4; --ink:#211D16; --muted:rgba(33,29,22,.55); --line:#E4E0D4;
  --serif:"Source Serif 4", Georgia, "Songti SC", "STSong", "Times New Roman", serif;
  --sans:"Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --maxw:1140px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}

.site-header{width:100%;max-width:var(--maxw);margin:0 auto;padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.wordmark{font-weight:600;font-size:17px;text-decoration:none;letter-spacing:-.01em;color:inherit;display:flex;align-items:center;gap:10px}
.wordmark img{width:24px;height:24px;display:block}
.site-nav{display:flex;gap:28px;font-size:15px}
.site-nav a{text-decoration:none;color:var(--ink);opacity:.85;transition:opacity .12s}
.site-nav a:hover{opacity:.5}

.rule{width:100%}
.rule hr{border:0;border-top:1px solid var(--line)}

.hero{flex:1 0 auto;width:100%;max-width:var(--maxw);margin:0 auto;padding:0 28px;display:flex;align-items:center}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,5.6vw,64px);line-height:1.08;letter-spacing:-.02em;max-width:880px;padding:96px 0 120px}
.hero h1 em{font-style:italic}
html[lang="zh-CN"] .hero h1{letter-spacing:0;line-height:1.22}

.site-footer{width:100%;max-width:var(--maxw);margin:0 auto;padding:36px 28px 44px;display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.site-footer a{text-decoration:none;color:var(--muted);transition:color .12s}
.site-footer a:hover{color:var(--ink)}
.site-footer .fm{font-weight:600;color:var(--ink)}
</style>
</head>
<body>

<header class="site-header">
  <a class="wordmark" href="#"><img src="logo.png" alt="">Animis&nbsp;AI</a>
  <nav class="site-nav">
    <a href="https://animis-ai.github.io/asset-library/" data-i18n="nav_library">Asset Library</a>
    <a href="#" id="lang-toggle">中文</a>
  </nav>
</header>

<div class="rule"><hr></div>

<section class="hero">
  <h1 data-i18n="hero_h1">We build the <em>world engine</em> for physical AI.</h1>
</section>

<div class="rule"><hr></div>

<footer class="site-footer">
  <span class="fm">Animis AI</span>
  <a href="mailto:animislab@gmail.com">animislab@gmail.com</a>
  <span>© 2026 Animis AI</span>
</footer>

<script>
const I18N = {
  en: {
    nav_library:"Asset Library",
    hero_h1:'We build the <em>world engine</em> for physical AI.',
  },
  zh: {
    nav_library:"资产库",
    hero_h1:'我们为物理 AI 构建<em>世界引擎</em>。',
  },
};
let lang = localStorage.getItem("animis-lang")
  || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const s = I18N[lang][el.dataset.i18n];
    if (typeof s !== "string") return;
    if (el.dataset.i18n === "hero_h1") el.innerHTML = s; else el.textContent = s;
  });
  document.getElementById("lang-toggle").textContent = lang === "en" ? "中文" : "EN";
}
document.getElementById("lang-toggle").addEventListener("click", (e) => {
  e.preventDefault();
  lang = lang === "en" ? "zh" : "en";
  localStorage.setItem("animis-lang", lang);
  applyLang();
});
applyLang();
</script>
</body>
</html>
