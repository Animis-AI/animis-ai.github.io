<style>
  :root{--accent:#cbff36;--accent2:#afdb00;--bg:#000;--surface:#1a1a1a;--elev:#232323;--hover:#2c2c2c;--border:#494949;

  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--font);color:var(--fg)}
  canvas{display:block;width:100%;height:100%}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at 50% 55%,transparent 38%,rgba(0,0,0,.62) 100%)}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:var(--bg);z-index:9;transition:opacity .6s}
  #loading .bar{position:absolute;top:0;left:0;height:2px;width:0;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
  #loading .name{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.24em;text-transform:uppercase;color:var(--fg)}
  #loading .sub{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg3)}
  @keyframes in{to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:1}}
  #topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;

  .ready #topbar{animation:in .7s .15s cubic-bezier(.2,.8,.2,1) forwards}
  #topbar>*{pointer-events:auto}
  .tb-left{display:flex;align-items:center;gap:11px}
  .tb-left img{width:22px;height:22px;display:block}
  .tb-left .brand{font-family:var(--disp);font-weight:700;font-size:12.5px;letter-spacing:.24em;text-transform:uppercase}
  .tb-right{display:flex;gap:6px}
  .tb-right button{display:inline-flex;align-items:center;gap:7px;font:500 12px/1 var(--font);color:var(--fg2);
    background:rgba(26,26,26,.78);border:1px solid var(--border);border-radius:999px;padding:8px 13px 8px 10px;
    cursor:pointer;backdrop-filter:blur(12px);transition:background .15s,color .15s,border-color .15s,transform .15s}
  .tb-right button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

    display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
  #details h2:hover{color:var(--fg)}
  #details h2 svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;transition:transform .2s}

  #details .tree{font-size:11.5px;margin:0 -6px}

    border-radius:999px;padding:9px 16px;transition:opacity .2s,transform .2s;pointer-events:none;z-index:8}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./vendor/three/OrbitControls.js";
import { GLTFLoader } from "./vendor/three/GLTFLoader.js";
import { RGBELoader } from "./vendor/three/RGBELoader.js";
import { EffectComposer } from "./vendor/three/jsm/postprocessing/EffectComposer.js";
import { SSAARenderPass } from "./vendor/three/jsm/postprocessing/SSAARenderPass.js";
import { GTAOPass } from "./vendor/three/jsm/postprocessing/GTAOPass.js";
import { UnrealBloomPass } from "./vendor/three/jsm/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "./vendor/three/jsm/postprocessing/OutputPass.js";
import { BokehPass } from "./vendor/three/jsm/postprocessing/BokehPass.js";
import { Reflector } from "./vendor/three/jsm/objects/Reflector.js";
import { OutlinePass } from "./vendor/three/jsm/postprocessing/OutlinePass.js";
import { Line2 } from "./vendor/three/jsm/lines/Line2.js";
import { LineMaterial } from "./vendor/three/jsm/lines/LineMaterial.js";
import { LineGeometry } from "./vendor/three/jsm/lines/LineGeometry.js";

const q = new URLSearchParams(location.search);
const MODE = q.get("mode") || "visual";
let FIX = q.get("fix") !== "0";        // 丢掉交付件那张迷彩 roughness 贴图(资产可在 inspect.json look.material_override=false 关掉,多材质常量 PBR 资产要保留自己的材质)
const ROUGH = parseFloat(q.get("rough") ?? "0.22");
const ENVI = parseFloat(q.get("envi") ?? "5.0");
const ENVROT = parseFloat(q.get("envrot") ?? "0");  // 环境绕 Y 旋转(度)
// 质量分档:high = GTAO + 景深 + 镜面地面 + 静止 8x;low = 只保留 IBL/阴影 + 静止 4x。
// 触屏 / 低核数 / 高 DPR 的设备自动走 low,?quality=high|low 强制。
const coarse = matchMedia("(pointer: coarse)").matches;
const weak = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 4;
const QUALITY = q.get("quality") || ((coarse || weak) ? "low" : "high");
const HIGH = QUALITY === "high";
const PP = q.get("pp") !== "0";          // 后处理总开关
const DOF = q.get("dof") !== "0" && HIGH; // 静止时景深
const DOF_K = parseFloat(q.get("dof_k") ?? "0.10");   // 0.15 已明显,0.10 是产品照那种轻微虚化
const MIRROR = q.get("mirror") === "1" && HIGH; // 镜面地面,默认关(?mirror=1 开)
const MIRROR_STRENGTH = parseFloat(q.get("mirror_k") ?? "0.08"); // 倒影中心强度(本体是 HDR 值,4% 已够显眼)
const HDRI = q.get("hdri") || "studio_small_09";   // 1k 已够,2k 要 6 MB
const ANISO = parseFloat(q.get("aniso") ?? "0.35");  // 资产 UV 在刀尖分段,再高就出条纹   // 拉丝金属各向异性
const TONE = q.get("tone") || "agx";     // agx | aces | neutral
const BLOOM = parseFloat(q.get("bloom") ?? "0");     // 金属高光是 HDR 值,黑底上会晕成一圈
const AO = parseFloat(q.get("ao") ?? "0.9");
const OPEN = parseFloat(q.get("open") ?? "0.5"); // 关节开度 0..1
const SLUG = (q.get("asset") || "scissors").replace(/[^a-z0-9_-]/gi, "");
const BASE = `../assets/${SLUG}/`;

// ---- 渲染器:照抄 Palatial 的配置 ----
const canvas = document.createElement("canvas");
document.body.appendChild(canvas);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, HIGH ? 2 : 1.5));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = { agx: THREE.AgXToneMapping, aces: THREE.ACESFilmicToneMapping,
                         neutral: THREE.NeutralToneMapping }[TONE] ?? THREE.AgXToneMapping;
renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030303);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.001, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotate = q.get("spin") !== "0";
controls.autoRotateSpeed = 0.8;

const LANG = q.get("lang") === "zh" ? "zh" : "en";
document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
const T = LANG === "zh" ? {
  tip: "拖动部件驱动关节 · 空白处拖动转视角 · 滚轮缩放", loading: "载入资产",
  meta: (h, j, l) => `${h} 个凸包 · ${j} 个关节 · ${l} 个连杆`,
  reset: "复位", collision: ["碰撞体", "碰撞体 · 叠加", "碰撞体 · 仅凸包"], wireframe: "线框",
  grid: "网格", spin: "自转", share: "分享", copied: "链接已复制", revolute: "转动", prismatic: "移动",
  details: "详情", physics: "物理", geometry: "几何", articulation: "铰接", hierarchy: "层级", pkg: "交付包",
  mass: "质量", material: "材质", size: "尺寸", density: "密度", volume: "体积", sfric: "静摩擦", dfric: "动摩擦",
  restitution: "恢复系数", com: "质心", inertia: "惯量 (对角)", meshes: "网格", vertices: "顶点", triangles: "三角面",
  hulls: "凸包", visual: "视觉", collision_g: "碰撞", axis: "转轴", limits: "限位", damping: "阻尼", friction: "摩擦",
  effort: "力矩上限", velocity: "速度上限", formats: "格式", engines: "引擎", validated: "已验证", units: "单位",
  shade: { lit: "光照", unlit: "无光照", normals: "法线", wire: "线框" },
} : {
  tip: "Drag a part to move its joint · drag empty space to orbit · scroll to zoom", loading: "Loading asset",
  meta: (h, j, l) => `${h} convex hulls · ${j} joint${j === 1 ? "" : "s"} · ${l} links`,
  reset: "Reset", collision: ["Collision", "Collision · overlay", "Collision · hulls"], wireframe: "Wireframe",
  grid: "Grid", spin: "Auto-rotate", share: "Share", copied: "Link copied", revolute: "revolute", prismatic: "prismatic",
  details: "Details", physics: "Physics", geometry: "Geometry", articulation: "Articulation", hierarchy: "Asset hierarchy", pkg: "Package",
  mass: "Mass", material: "Material", size: "Size", density: "Density", volume: "Volume", sfric: "Static friction", dfric: "Dynamic friction",
  restitution: "Restitution", com: "COM", inertia: "Inertia (diag)", meshes: "Meshes", vertices: "Vertices", triangles: "Triangles",
  hulls: "Hulls", visual: "Visual", collision_g: "Collision", axis: "Axis", limits: "Limits", damping: "Damping", friction: "Friction",
  effort: "Effort", velocity: "Velocity", formats: "Formats", engines: "Engines", validated: "Validated", units: "Units",
  shade: { lit: "Lit", unlit: "Unlit", normals: "Normals", wire: "Wireframe" },
};
document.getElementById("tip").textContent = T.tip;
document.querySelector("#loading .name").textContent = SLUG.replace(/[_-]+/g, " ");
document.querySelector("#loading .sub").textContent = T.loading;
const setProgress = (pct) => { const b = document.querySelector("#loading .bar"); if (b) b.style.width = pct + "%"; };
setProgress(12);
if (q.get("debug") === "1") document.documentElement.classList.add("debug");
const ACCENT = 0xCBFF36;
function toast(msg) {
  const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 1600);
}
const hud = document.getElementById("hud");
const log = (m) => { hud.textContent = m; console.log("HUD", m); };

// ---- HDRI IBL ----
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = await new Promise((res, rej) =>
  new RGBELoader().load(`hdri/${HDRI}.hdr`, res, undefined, rej));
envTex.mapping = THREE.EquirectangularReflectionMapping;
scene.environment = pmrem.fromEquirectangular(envTex).texture;
setProgress(40);
scene.environmentIntensity = ENVI;
scene.environmentRotation = new THREE.Euler(0, THREE.MathUtils.degToRad(ENVROT), 0);

// 一盏方向光只为了投影(IBL 不产生阴影)
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(1.2, 2.4, 1.0);
sun.castShadow = true;
sun.shadow.mapSize.set(HIGH ? 4096 : 2048, HIGH ? 4096 : 2048);
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.002;
scene.add(sun);

// ---- 资产 ----
const spec = await fetch(BASE + "inspect/inspect.json").then((r) => r.json());
if (q.get("fix") === null && spec.look && spec.look.material_override === false) FIX = false;
const loader = new GLTFLoader();
const loadGlb = (u) => new Promise((res, rej) => loader.load(u, res, undefined, rej));

function rpyQuat(rpy) {
  const m = new THREE.Matrix4().makeRotationZ(rpy[2]);
  m.multiply(new THREE.Matrix4().makeRotationY(rpy[1]));
  m.multiply(new THREE.Matrix4().makeRotationX(rpy[0]));
  return new THREE.Quaternion().setFromRotationMatrix(m);
}

const root = new THREE.Group();
root.rotation.x = -Math.PI / 2;                 // URDF Z-up -> three Y-up
scene.add(root);

const linkGroups = {}, visHolders = {}, colHolders = {};
for (const l of spec.links) {
  const g = new THREE.Group(); const v = new THREE.Group(); const c = new THREE.Group();
  g.add(v, c); linkGroups[l.name] = g; visHolders[l.name] = v; colHolders[l.name] = c;
}
const childLinks = new Set(); const movable = [];
for (const j of spec.joints) {
  const pivot = new THREE.Group();
  pivot.position.fromArray(j.xyz);
  pivot.quaternion.copy(rpyQuat(j.rpy));
  const motion = new THREE.Group();
  pivot.add(motion); motion.add(linkGroups[j.child]);
  linkGroups[j.parent].add(pivot);
  childLinks.add(j.child);
  if (["revolute", "continuous", "prismatic"].includes(j.type)) movable.push({ ...j, motion });
}
for (const l of spec.links) if (!childLinks.has(l.name)) root.add(linkGroups[l.name]);

// ---- 关节控件(Palatial 的 proxy widget):转动关节 = 半透明圆盘 + 限位弧 + 指针 ----
// 挂在 pivot 下(不随 motion 转),法线 = 关节轴;半径按相机距离每帧重算,屏幕上大小恒定
const proxies = [], fatMats = [];
for (const j of movable) {
  const pivot = j.motion.parent;
  const axis = new THREE.Vector3().fromArray(j.axis).normalize();
  const g = new THREE.Group();
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), axis);   // 局部 +Z 对齐轴
  pivot.add(g);
  const mat = (op) => new THREE.MeshBasicMaterial({ color: ACCENT, transparent: true, opacity: op,
                        side: THREE.DoubleSide, depthTest: false, depthWrite: false });
  // 粗线(Line2):像素宽度,WebGL 原生线只有 1px,表盘看起来会很寒酸
  const fat = (pts, op, w) => {
    const g = new LineGeometry(); g.setPositions(pts.flatMap((v) => [v.x, v.y, v.z]));
    const m = new LineMaterial({ color: ACCENT, linewidth: w, transparent: true, opacity: op,
                                 depthTest: false, depthWrite: false });
    m.resolution.set(innerWidth, innerHeight); fatMats.push(m);
    const l = new Line2(g, m); l.computeLineDistances(); return l;
  };
  let disc, arc, needle, knob;
  if (j.type === "prismatic") {
    arc = fat([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 1)], 0.9, 2);
    knob = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 12), mat(0.9));
    disc = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.2, 32), mat(0.4));
    g.add(arc, knob, disc);
  } else {
    disc = new THREE.Mesh(new THREE.CircleGeometry(1, 64), mat(0.22));
    const span = j.upper - j.lower, N = Math.max(8, Math.round(span / 0.05));
    const pts = []; for (let i = 0; i <= N; i++) { const a = j.lower + span * i / N; pts.push(new THREE.Vector3(Math.cos(a), Math.sin(a), 0)); }
    arc = fat(pts, 0.95, 2.5);
    needle = fat([new THREE.Vector3(0, 0, 0), new THREE.Vector3(1, 0, 0)], 0.95, 2);
    knob = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), mat(0.95));
    knob.position.set(1, 0, 0); needle.add(knob);
    const rim = new THREE.Mesh(new THREE.RingGeometry(0.97, 1.0, 64), mat(0.5));
    g.add(disc, rim, arc, needle);
  }
  g.traverse((n) => { n.renderOrder = 999; n.userData.link = j.child; n.userData.proxy = true; });
  proxies.push({ joint: j, group: g, disc, arc, needle, knob, hot: false });
}
// 关节很多的资产(键盘:78 个键各一个滑动关节)不能满屏画表盘,只画悬停/拖拽中的那个
const DENSE = movable.length > 12;
if (DENSE) {   // 同组滑动关节按枢轴 X 坐标错相位:idle 时键盘像波浪一样起伏,而不是 78 个键一起按下
  const ps = movable.filter((j) => j.type === "prismatic");
  const xs = ps.map((j) => j.motion.parent.position.x);
  const lo = Math.min(...xs), hi = Math.max(...xs);
  ps.forEach((j, i) => { j.phase = hi > lo ? (xs[i] - lo) / (hi - lo) * Math.PI * 2 : 0; });
}
function updateProxies() {
  for (const px of proxies) {
    if (DENSE) { px.group.visible = px.hot; if (!px.hot) continue; }
    const wp = new THREE.Vector3(); px.group.getWorldPosition(wp);
    const d = camera.position.distanceTo(wp);
    // Palatial 的公式:控件在屏幕上大小恒定,约视口高的 ~7%
    const r = d * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * 0.13 * (px.joint.type === "prismatic" ? 1.4 : 1);
    px.group.scale.setScalar(r);
    const j = px.joint;
    if (j.type === "prismatic") { px.arc.scale.z = (j.upper - j.lower) / r; px.knob.position.z = (j.value - j.lower) / r; }
    else px.needle.rotation.z = j.value;
    const k = px.hot ? 1.0 : 0.8;
    px.disc.material.opacity = (j.type === "prismatic" ? 0.4 : 0.22) * k;
    px.arc.material.opacity = 0.95 * k; if (px.needle) px.needle.material.opacity = 0.95 * k;
    px.knob.material.opacity = 0.95 * k;
  }
}
let gridHelper = null;

const jobs = [];
for (const l of spec.links) {
  for (const vis of l.visuals) {
    jobs.push(loadGlb(BASE + "inspect/" + vis.file).then((g) => {
      g.scene.traverse((n) => {
        if (!n.isMesh) return;
        n.castShadow = true; n.receiveShadow = true;
        if (FIX) {                     // albedo 留着,金属度/粗糙度用常量
          // 拉丝金属:沿加工方向拉长的各向异性高光,钢制品的关键质感
          n.material = new THREE.MeshPhysicalMaterial({
            map: n.material.map,
            color: n.material.color.clone(),
            metalness: 1.0, roughness: ROUGH,
            anisotropy: ANISO,
            aoMap: n.material.aoMap, aoMapIntensity: 1.0,   // 离线烘的 AO(若有)
          });
        }

}
const HUES = [210, 25, 130, 270, 55, 175, 330, 95, 240, 15, 300, 150];

jobs.push(loadGlb(BASE + "inspect/collision.glb").then((g) => {
  for (const ln of [...g.scene.children]) {

        n.material = new THREE.MeshStandardMaterial({
          color: hc,

          transparent: true, opacity: 1,

}));

function setJoint(j, v) {
  j.value = v;

  else j.motion.quaternion.setFromAxisAngle(
    new THREE.Vector3().fromArray(j.axis).normalize(), v);
}

// ---- 模式:视觉 / 碰撞体 / 叠加,运行时可切 ----
const baseTone = { agx: THREE.AgXToneMapping, aces: THREE.ACESFilmicToneMapping,
                   neutral: THREE.NeutralToneMapping }[TONE] ?? THREE.AgXToneMapping;
let curMode = MODE, shade = "lit";
let wake = () => {};
// 凸包靠纯色区分,AgX 会冲淡;碰撞相关模式与 Unlit / Normals 着色整帧改 Neutral
const syncTone = () => { renderer.toneMapping = ((curMode === "visual" && shade === "lit") || q.get("tone")) ? baseTone : THREE.NeutralToneMapping; };
// 着色模式(Palatial:Lit / Unlit / Normals / Wireframe):材质按 mesh 缓存,切换零开销
function applyShade(s) {
  shade = s;
  Object.values(visHolders).forEach((h) => h.traverse((n) => {
    if (!n.isMesh) return;
    const L = (n.userData.lit ??= n.material);
    L.wireframe = false;
    if (s === "unlit") n.material = (n.userData.unlit ??= new THREE.MeshBasicMaterial({ map: L.map, color: L.color }));
    else if (s === "normals") n.material = (n.userData.nrm ??= new THREE.MeshNormalMaterial());
    else { n.material = L; L.wireframe = s === "wire"; }
  }));
  syncTone(); wake();
}                              // 后处理就绪后会被替换
function applyMode(m) {
  curMode = m;
  const showV = m !== "collision", showC = m !== "visual";
  Object.values(visHolders).forEach((n) => (n.visible = showV));
  Object.values(colHolders).forEach((n) => (n.visible = showC));
  scene.traverse((n) => {
    if (n.isMesh && n.material?.polygonOffset) {
      n.material.opacity = m === "both" ? 0.25 : 1;
      n.material.depthWrite = m !== "both";
    }
  });
  syncTone();
  if (typeof hullN === "number") log(`${QUALITY} · mode=${m} · hulls=${hullN} · links=${spec.links.length}`);
  wake();
}
applyMode(MODE);

// ---- 取景 + 地面 ----
root.updateMatrixWorld(true);
// 包围盒只算资产本体:关节控件挂在树里但是屏幕空间尺寸,不能参与取景
const box = new THREE.Box3();
root.traverse((n) => { if (n.isMesh && !n.userData.proxy) box.expandByObject(n); });
const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
const radius = size.length() / 2;
controls.target.copy(c);
camera.position.set(c.x + radius * 1.5, c.y + radius * 1.15, c.z + radius * 1.5);
camera.near = radius / 20; camera.far = radius * 60;   // 近平面别太小,地面几层要靠深度分开
controls.minDistance = radius * 0.6; controls.maxDistance = radius * 8;
camera.updateProjectionMatrix(); controls.update();
sun.position.set(c.x + radius * 2, c.y + radius * 4, c.z + radius * 2);
sun.target.position.copy(c); scene.add(sun.target);
const d = radius * 3;
Object.assign(sun.shadow.camera, { left: -d, right: d, top: d, bottom: -d, near: 0.001, far: d * 6 });
sun.shadow.camera.updateProjectionMatrix();

const groundY = box.min.y - radius * 0.02;
if (MIRROR) {
  // 镜面层在最下;上面盖一层径向渐变的黑色遮罩控制倒影强度(中心 MIRROR_STRENGTH,
  // 外圈全黑)。层距要拉开到 1% 物体尺度,否则三层共面 z-fighting,遮罩会被镜面压掉。
  const mirror = new Reflector(new THREE.PlaneGeometry(radius * 40, radius * 40), {
    color: 0xffffff,
    textureWidth: Math.round(innerWidth * Math.min(devicePixelRatio, 2)),
    textureHeight: Math.round(innerHeight * Math.min(devicePixelRatio, 2)),
    clipBias: 0.002,
  });
  mirror.rotation.x = -Math.PI / 2;
  mirror.position.y = groundY - radius * 0.06;
  scene.add(mirror);

  const cv = document.createElement("canvas"); cv.width = cv.height = 1024;
  const g2 = cv.getContext("2d");
  const grd = g2.createRadialGradient(512, 512, 0, 512, 512, 512);
  grd.addColorStop(0.0, `rgba(0,0,0,${1 - MIRROR_STRENGTH})`);
  grd.addColorStop(0.25, `rgba(0,0,0,${1 - MIRROR_STRENGTH * 0.6})`);
  grd.addColorStop(0.55, "rgba(0,0,0,1)");
  grd.addColorStop(1.0, "rgba(0,0,0,1)");
  g2.fillStyle = grd; g2.fillRect(0, 0, 1024, 1024);
  const veilTex = new THREE.CanvasTexture(cv);
  veilTex.colorSpace = THREE.SRGBColorSpace;
  const V = q.get("veil");
  const veilMat = V === "solid" ? new THREE.MeshBasicMaterial({ color: 0x000000 })
    : V === "opacity" ? new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 1 - MIRROR_STRENGTH, depthWrite: false })
    : V === "nodepth" ? new THREE.MeshBasicMaterial({ map: veilTex, transparent: true, depthWrite: false, depthTest: false })
    : new THREE.MeshBasicMaterial({ map: veilTex, transparent: true, depthWrite: false });
  const veil = new THREE.Mesh(new THREE.PlaneGeometry(radius * 40, radius * 40), veilMat);
  window.__veil = veil; window.__mirror = mirror;
  veil.rotation.x = -Math.PI / 2;
  veil.position.set(c.x, groundY - radius * 0.03, c.z);
  veil.renderOrder = 5;
  scene.add(veil);
}
{ // 暗色台面:径向渐变盘,让物体"落在"什么上面,而不是悬在纯黑里
  const cv = document.createElement("canvas"); cv.width = cv.height = 512;
  const g2 = cv.getContext("2d"), grd = g2.createRadialGradient(256, 256, 0, 256, 256, 256);
  grd.addColorStop(0, "rgba(28,28,28,1)"); grd.addColorStop(0.45, "rgba(16,16,16,.85)"); grd.addColorStop(1, "rgba(0,0,0,0)");
  g2.fillStyle = grd; g2.fillRect(0, 0, 512, 512);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(radius * 7, radius * 7),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false }));
  pad.rotation.x = -Math.PI / 2; pad.position.set(c.x, groundY - radius * 0.004, c.z); pad.renderOrder = -2;
  scene.add(pad);
}
gridHelper = new THREE.GridHelper(radius * 8, 32, 0x8a8a8a, 0x454545);   // AgX 会压暗,给亮一点
gridHelper.position.set(c.x, groundY + radius * 0.001, c.z);
gridHelper.material.transparent = true; gridHelper.material.opacity = 0.9;
gridHelper.visible = q.get("grid") !== "0";   // 默认开,?grid=0 关
scene.add(gridHelper);
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(radius * 40, radius * 40),
  // 阴影层只画阴影,绝不能写深度:它在遮罩层上方且先渲染,写了深度就把镜面遮罩挡掉了
  new THREE.ShadowMaterial({ opacity: MIRROR ? 0.5 : 0.35, depthWrite: false }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = groundY;
ground.receiveShadow = true;

// ---- 后处理:GTAO(接触阴影) + 轻微 Bloom + 输出;交互停下后升 8x 超采样 ----
let composer = null, ssaaPass = null, bokeh = null, outline = null, stillTimer = 0, isStill = false;
if (PP) {
  composer = new EffectComposer(renderer);
  ssaaPass = new SSAARenderPass(scene, camera);
  ssaaPass.sampleLevel = 0;                       // 交互时 1x,静止后 3(=8x)
  composer.addPass(ssaaPass);
  // 悬停/拖拽描边:Palatial 参数 —— 悬停 strength 3,选中 12 + glow
  outline = new OutlinePass(new THREE.Vector2(innerWidth, innerHeight), scene, camera);
  outline.edgeStrength = 3; outline.edgeGlow = 0; outline.edgeThickness = 1; outline.pulsePeriod = 0;
  outline.visibleEdgeColor.set(ACCENT); outline.hiddenEdgeColor.set(ACCENT).multiplyScalar(0.35);
  composer.addPass(outline);
  if (HIGH) {
    const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
    gtao.updateGtaoMaterial({ radius: radius * 0.12, distanceExponent: 1, thickness: radius * 0.04,
                              scale: 1.2, samples: 16, distanceFallOff: 1 });
    gtao.blendIntensity = AO;
    composer.addPass(gtao);
  }
  if (BLOOM > 0) {                                 // 金属高光是 HDR 值,bloom 一重就成一片白
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), BLOOM, 0.5, 1.1));
  }
  if (DOF) {
    // 景深只在静止时开:焦点锁在轨道中心,光圈按物体尺度给,远端轻微虚化
    bokeh = new BokehPass(scene, camera, { focus: 1, aperture: 0.0008, maxblur: 0.006 });
    bokeh.enabled = false;
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  wake = () => {                                  // 任何交互回到快速档
    isStill = false; ssaaPass.sampleLevel = 0;
    if (bokeh) bokeh.enabled = false;
    clearTimeout(stillTimer);
    stillTimer = setTimeout(() => {
      isStill = true;
      ssaaPass.sampleLevel = HIGH ? 3 : 2;
      if (bokeh) {
        bokeh.uniforms.focus.value = camera.position.distanceTo(controls.target);
        bokeh.uniforms.aperture.value = DOF_K / Math.max(radius * 10, 1e-3);
        bokeh.uniforms.maxblur.value = 0.01;
        bokeh.enabled = true;
      }
    }, 350);
  };
  ["pointerdown","pointermove","wheel"].forEach((ev) =>
    renderer.domElement.addEventListener(ev, wake, { passive: true }));
  wake();
}

renderer.render(scene, camera);
await new Promise((r) => requestAnimationFrame(r));
renderer.render(scene, camera);
log(`${QUALITY} · mode=${MODE} · hulls=${hullN} · links=${spec.links.length}`);
document.title = "ready";
setProgress(100);

document.getElementById("title").querySelector("p").textContent = T.meta(hullN, movable.length, spec.links.length);
document.documentElement.classList.add("ready");
setTimeout(() => { const t = document.getElementById("tip"); if (t) t.style.opacity = "0"; }, 6500);
// 入场:相机从 1.35 倍距离缓缓推到位
const introFrom = camera.position.clone().sub(controls.target).multiplyScalar(1.35).add(controls.target);
const introTo = camera.position.clone();
let intro = 1;
camera.position.copy(introFrom);
if (bokeh) bokeh.enabled = false; if (ssaaPass) ssaaPass.sampleLevel = 0; clearTimeout(stillTimer);
{ const l = document.getElementById("loading"); setTimeout(() => { l.style.opacity = "0"; l.style.pointerEvents = "none"; setTimeout(() => l.remove(), 650); }, 250); }
addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight, false);
  composer?.setSize(innerWidth, innerHeight);
  outline?.setSize(innerWidth, innerHeight);
  fatMats.forEach((m) => m.resolution.set(innerWidth, innerHeight));
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});
// ---- 关节控制:滑杆 + 直接拖拽 ----
const jointByLink = {};                 // 被驱动的 link -> 关节
for (const j of movable) jointByLink[j.child] = j;

const panel = document.createElement("div");
panel.id = "joints";
// 长度单位按行程自适应:键帽 0.8 mm 行程显示 cm 会变成 "-0.0 cm"
const fmtLen = (j, v) => {
  const span = Math.abs(j.upper - j.lower);
  return span < 0.01 ? `${(v * 1000).toFixed(2)} mm` : span < 1 ? `${(v * 100).toFixed(1)} cm` : `${v.toFixed(3)} m`;
};
const fmtVal = (j, v) => j.type === "prismatic" ? fmtLen(j, v) : `${Math.round(v * 180 / Math.PI)}°`;
// 关节分组:关节很多的资产(键盘 78 个键)把 同类型 + 同限位 + 同名字前缀 的关节合成一张卡,
// 一根滑杆驱动整组;拖某一个键时该键成为组的"当前关节",卡片显示它的名字和值
const groups = [];
for (const j of movable) {
  const key = DENSE ? `${j.type}|${j.lower.toFixed(6)}|${j.upper.toFixed(6)}` : j.name;
  let g = groups.find((x) => x.key === key);
  if (!g) { g = { key, joints: [], type: j.type, lower: j.lower, upper: j.upper, lead: j }; groups.push(g); }
  g.joints.push(j); j.group = g;
}
const commonPrefix = (names) => { let p = names[0]; for (const n of names) { while (!n.startsWith(p)) p = p.slice(0, -1); } return p; };
for (const g of groups) {
  if (g.joints.length === 1) { g.name = g.joints[0].name; continue; }
  const pre = commonPrefix(g.joints.map((j) => j.name)).replace(/[_-]+$/, "").replace(/[_-]?joints?$/, "").replace(/[_-]+$/, "");
  g.name = `${pre || g.type} × ${g.joints.length}`;
}
panel.innerHTML = groups.map((g, i) => `
  <label>
    <div class="jh"><span class="jn">${g.name} · ${T[g.type] || g.type}${g.joints.length > 1 ? `<i class="jl" data-l="${i}"></i>` : ""}</span><b data-v="${i}"></b></div>
    <input type="range" min="0" max="1000" data-j="${i}">
    <div class="jr"><span>${fmtVal(g, g.lower)}</span><span>${fmtVal(g, g.upper)}</span></div>
  </label>`).join("");
document.body.appendChild(panel);

const frac = (j) => (j.value - j.lower) / ((j.upper - j.lower) || 1);
function syncUI() {
  groups.forEach((g, i) => {
    const j = g.lead;
    panel.querySelector(`input[data-j="${i}"]`).value = Math.round(frac(j) * 1000);
    panel.querySelector(`b[data-v="${i}"]`).textContent = fmtVal(j, j.value);
    const l = panel.querySelector(`i.jl[data-l="${i}"]`); if (l) l.textContent = ` · ${j.name}`;
  });
}
panel.addEventListener("input", (e) => {
  const g = groups[+e.target.dataset.j];
  stopIdle();
  for (const j of g.joints) setJoint(j, j.lower + (e.target.value / 1000) * (j.upper - j.lower));
  syncUI();
});

// 拖拽:射线命中某个 link 的网格 -> 拖它绕所属关节转(Palatial §4 的平面投影解法)
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const DRAG_SENSITIVITY = 1.5;
let drag = null;

const setNdc = (e) => {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
};
const pickJoint = (e) => {
  setNdc(e);
  raycaster.setFromCamera(ndc, camera);
  for (const hit of raycaster.intersectObject(root, true)) {
    const j = jointByLink[hit.object.userData.link];
    if (j) return { joint: j, point: hit.point.clone(), distance: hit.distance };
  }
  return null;
};

const linkMeshes = (link) => { const out = []; visHolders[link]?.traverse((n) => { if (n.isMesh) out.push(n); }); return out; };
function setHover(j, active) {
  if (outline) {
    outline.selectedObjects = j ? linkMeshes(j.child) : [];
    outline.edgeStrength = active ? 12 : 3;
    outline.edgeGlow = active ? 1 : 0;
  }
  for (const px of proxies) px.hot = !!j && px.joint === j;
  if (j && j.group) j.group.lead = j;
  panel.querySelectorAll("label").forEach((l, i) => l.classList.toggle("hot", !!j && groups[i] === j.group));
  if (j) syncUI();
}

renderer.domElement.addEventListener("pointerdown", (e) => {
  const hit = pickJoint(e);
  if (!hit) return;
  stopIdle();
  controls.enabled = false;                       // 别同时转视角
  renderer.domElement.setPointerCapture(e.pointerId);
  drag = { ...hit, prevRay: raycaster.ray.clone() };
  renderer.domElement.style.cursor = "grabbing";
  setHover(hit.joint, true);
});

renderer.domElement.addEventListener("pointermove", (e) => {
  if (!drag) {                                    // 悬停:光标 + 描边 + 控件提亮
    const hit = pickJoint(e);
    renderer.domElement.style.cursor = hit ? "grab" : "default";
    setHover(hit ? hit.joint : null, false);
    return;
  }
  setNdc(e);
  raycaster.setFromCamera(ndc, camera);
  const j = drag.joint;
  const pivot = j.motion.parent;
  pivot.updateMatrixWorld();
  const origin = new THREE.Vector3().setFromMatrixPosition(pivot.matrixWorld);
  const axis = new THREE.Vector3().fromArray(j.axis).normalize()
    .transformDirection(pivot.matrixWorld).normalize();

  let delta = 0;
  if (j.type === "prismatic") {
    const p0 = drag.prevRay.at(drag.distance, new THREE.Vector3());
    const p1 = raycaster.ray.at(drag.distance, new THREE.Vector3());
    delta = p1.sub(p0).dot(axis);
  } else {
    const view = camera.position.clone().sub(drag.point).normalize();
    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(axis, origin);
    if (Math.abs(view.dot(axis)) > 0.3) {
      // 常规:上一帧与当前帧的射线点投影到关节平面,夹角即转角增量
      const p0 = plane.projectPoint(drag.prevRay.at(drag.distance, new THREE.Vector3()), new THREE.Vector3()).sub(origin);
      const p1 = plane.projectPoint(raycaster.ray.at(drag.distance, new THREE.Vector3()), new THREE.Vector3()).sub(origin);
      if (p0.lengthSq() > 1e-12 && p1.lengthSq() > 1e-12) {
        const sign = Math.sign(new THREE.Vector3().crossVectors(p0, p1).dot(axis)) || 1;
        delta = sign * p0.angleTo(p1);
      }
    } else {
      // 退化(视线几乎垂直于转轴):用切线方向的位移近似,避免数值爆炸
      const arm = drag.point.clone().sub(origin);
      const tangent = new THREE.Vector3().crossVectors(axis, arm);
      const r = arm.length();
      if (tangent.lengthSq() > 1e-12 && r > 1e-9) {
        tangent.normalize();
        const p0 = drag.prevRay.at(drag.distance, new THREE.Vector3());
        const p1 = raycaster.ray.at(drag.distance, new THREE.Vector3());
        delta = p1.sub(p0).dot(tangent) / r;
      }
    }
  }

  setJoint(j, THREE.MathUtils.clamp(j.value + delta * DRAG_SENSITIVITY, j.lower, j.upper));
  syncUI();
  drag.prevRay = raycaster.ray.clone();
});

const endDrag = (e) => {
  if (!drag) return;
  drag = null;
  controls.enabled = true;
  renderer.domElement.style.cursor = "default";
  setHover(null, false);
  if (e && e.pointerId != null && renderer.domElement.hasPointerCapture?.(e.pointerId))
    renderer.domElement.releasePointerCapture(e.pointerId);
};
renderer.domElement.addEventListener("pointerup", endDrag);
renderer.domElement.addEventListener("pointercancel", endDrag);

// ---- idle 演示:关节在限位内正弦往复,一交互就停(Palatial §6) ----
let idle = q.get("idle") !== "0";
const t0 = performance.now();
function stopIdle() {
  idle = false; controls.autoRotate = false; if (typeof paintBar === "function") paintBar();
  const tip = document.getElementById("tip");
  if (tip) tip.style.opacity = "0";
}
controls.addEventListener("start", stopIdle);

syncUI();
renderer.setAnimationLoop(() => {
  if (idle && movable.length) {
    const t = (performance.now() - t0) / 1000 * 0.8;
    for (const j of movable) {
      if (j.lower === j.upper) continue;
      setJoint(j, j.lower + (Math.sin(t * (j.phase ? 1.8 : 1) - (j.phase || 0)) + 1) / 2 * (j.upper - j.lower));
    }
    syncUI();
  }
  if (intro > 0.001) {                         // 入场推镜:期间不做静止超采样/景深,到位后重新对焦
    intro *= 0.9; camera.position.lerpVectors(introTo, introFrom, intro);
    if (intro <= 0.001) { camera.position.copy(introTo); wake(); }
  }
  controls.update();
  updateProxies();
  if (composer) composer.render(); else renderer.render(scene, camera);
});
// 调试用:让测试脚本能读到关节状态
// ---- 顶栏 ----
const camHome = { pos: introTo.clone(), target: controls.target.clone() };
let modeIdx = ["visual", "both", "collision"].indexOf(curMode);
const btn = (a) => document.querySelector(`#topbar button[data-act="${a}"]`);
const lbl = (a, t) => { btn(a).querySelector("span").textContent = t; };
const paintBar = () => {
  lbl("reset", T.reset);
  lbl("collision", T.collision[modeIdx]); btn("collision").classList.toggle("on", modeIdx > 0);
  document.querySelectorAll("#shade button").forEach((b) => { b.classList.toggle("on", b.dataset.shade === shade); b.title = T.shade[b.dataset.shade]; });
  btn("details").title = T.details; btn("details").classList.toggle("on", !document.documentElement.classList.contains("nodetails"));
  lbl("grid", T.grid); btn("grid").classList.toggle("on", !!gridHelper?.visible);
  lbl("spin", T.spin); btn("spin").classList.toggle("on", controls.autoRotate);
  lbl("share", T.share);
};
btn("reset").addEventListener("click", () => {
  stopIdle();
  movable.forEach((j) => setJoint(j, j.lower)); syncUI();
  camera.position.copy(camHome.pos); controls.target.copy(camHome.target); controls.update(); wake();
});
btn("collision").addEventListener("click", () => { modeIdx = (modeIdx + 1) % 3; applyMode(["visual", "both", "collision"][modeIdx]); paintBar(); });
document.querySelectorAll("#shade button").forEach((b) => b.addEventListener("click", () => { applyShade(b.dataset.shade); paintBar(); }));
btn("details").addEventListener("click", () => { document.documentElement.classList.toggle("nodetails"); paintBar(); });
if (innerWidth < 900) document.documentElement.classList.add("nodetails");   // 窄视口默认收起,别挡住模型
btn("grid").addEventListener("click", () => { gridHelper.visible = !gridHelper.visible; paintBar(); wake(); });
btn("spin").addEventListener("click", () => { controls.autoRotate = !controls.autoRotate; paintBar(); });
btn("share").addEventListener("click", async () => {
  const url = new URL(location.href); url.searchParams.delete("spin"); url.searchParams.delete("idle"); url.searchParams.delete("debug");
  try { await navigator.clipboard.writeText(url.toString()); toast(T.copied); } catch { prompt("URL", url.toString()); }
});
paintBar();

// ---- Details 面板:物理 / 几何 / 铰接 / 层级 / 交付包(数据来自 inspect.json 的 physics/geometry,由管线 inspect_physics.py 写入) ----
{
  const P = spec.physics || {}, G = spec.geometry || null, PL = P.links || {}, PJ = P.joints || {};
  const esc = (x) => String(x).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const num = (v, d = 3) => (v == null || isNaN(v)) ? null : (+v).toFixed(d).replace(/\.?0+$/, "");
  const kg = (m) => m == null ? null : `${num(m, 3)} kg`;
  const mm = (v) => Math.round(v * 1000);
  const sci = (v) => (+v).toExponential(2).replace("e-", "e−");
  const row = (k, v, cls = "") => v == null || v === "" ? "" : `<div class="row"><span>${esc(k)}</span><b class="${cls}">${esc(v)}</b></div>`;
  const section = (id, title, body, closed = false) => body ? `<section id="d-${id}" class="${closed ? "closed" : ""}"><h2>${esc(title)}<svg viewBox="0 0 10 10"><path d="M2 3.5l3 3 3-3"/></svg></h2><div class="body">${body}</div></section>` : "";

  // 几何统计:优先交付件的真实计数,没有就数加载进来的场景
  const sceneCount = (holders) => { let v = 0, t = 0, m = 0; Object.values(holders).forEach((h) => h.traverse((n) => { if (!n.isMesh) return; m++; const g = n.geometry; v += g.attributes.position.count; t += (g.index ? g.index.count : g.attributes.position.count) / 3; })); return { meshes: m, vertices: v, triangles: Math.round(t) }; };
  const gv = G?.visual || sceneCount(visHolders), gc = G?.collision || { hulls: hullN, ...sceneCount(colHolders) };
  const fmtN = (n) => n == null ? null : (+n).toLocaleString("en-US");

  let physics = "";
  if (P.total_mass != null || P.size) {
    const size = P.size ? (Math.max(...P.size) < 1 ? `${P.size.map(mm).join(" × ")} mm` : `${P.size.map((v) => num(v, 3)).join(" × ")} m`) : null;
    physics = row(T.mass, kg(P.total_mass)) + row(T.material, P.material) + row(T.size, size)
      + row(T.volume, P.volume != null ? `${num(P.volume * 1e6, 1)} cm³` : null)
      + row(T.density, P.density != null ? `${Math.round(P.density).toLocaleString("en-US")} kg/m³` : null)
      + row(T.sfric, num(P.static_friction, 2)) + row(T.dfric, num(P.dynamic_friction, 2)) + row(T.restitution, num(P.restitution, 2));
    physics += row(T.units, "m · kg · rad · Z-up");
  }

  const geometry = `<div class="sub">${esc(T.visual)}</div>` + row(T.meshes, fmtN(gv.meshes)) + row(T.vertices, fmtN(gv.vertices)) + row(T.triangles, fmtN(gv.triangles))
    + `<div class="sub">${esc(T.collision_g)}</div>` + row(T.hulls, fmtN(gc.hulls), "acc") + row(T.vertices, fmtN(gc.vertices), "acc") + row(T.triangles, fmtN(gc.triangles), "acc");

  let articulation = "";
  for (const g of groups) {
    const j = g.joints[0];
    const dj = PJ[j.name] || {};
    const lim = `${fmtVal(j, j.lower)} … ${fmtVal(j, j.upper)}`;
    articulation += `<div class="sub">${esc(g.name)} · ${esc(T[j.type] || j.type)}</div>`
      + row(T.axis, `[${j.axis.map((v) => num(v, 2)).join(", ")}]`) + row(T.limits, lim)
      + row(T.damping, dj.damping != null ? `${dj.damping} ${j.type === "prismatic" ? "N·s/m" : "N·m·s/rad"}` : null) + row(T.friction, dj.friction != null ? `${dj.friction} ${j.type === "prismatic" ? "N" : "N·m"}` : null)
      + row(T.effort, dj.effort != null ? `${dj.effort} ${j.type === "prismatic" ? "N" : "N·m"}` : null) + row(T.velocity, dj.velocity != null ? `${dj.velocity} ${j.type === "prismatic" ? "m/s" : "rad/s"}` : null);
  }

  // 层级树:link → joint → child link,悬停行 = 场景里描边
  const childOf = {}; for (const j of spec.joints) (childOf[j.parent] ??= []).push(j);
  const roots = spec.links.filter((l) => !spec.joints.some((j) => j.child === l.name));
  const node = (name, depth) => {
    const l = PL[name] || {};
    const I = l.inertia ? [l.inertia.ixx, l.inertia.iyy, l.inertia.izz] : null;
    let h = `<div class="l" data-link="${esc(name)}" style="padding-left:${6 + depth * 14}px"><i class="dot"></i>${esc(name)}<span class="m">${l.mass != null ? esc(kg(l.mass)) : ""}</span></div>`;
    if (l.com || I) h += `<div class="lk" style="padding-left:${20 + depth * 14}px">`
      + row(T.com, l.com ? `${l.com.map((v) => num(v * 1000, 1)).join(", ")} mm` : null)
      + (I ? `<div class="row"><span>${esc(T.inertia)}</span></div><div class="mono">${I.map(sci).join("  ")}  kg·m²</div>` : "") + `</div>`;
    for (const j of childOf[name] || []) {
      h += `<div class="jrow" style="padding-left:${6 + (depth + 1) * 14}px"><span class="j">⟳ ${esc(j.name)} · ${esc(T[j.type] || j.type)}</span></div>` + node(j.child, depth + 1);
    }
    return h;
  };
  const hierarchy = `<div class="tree">${roots.map((l) => node(l.name, 0)).join("")}</div>`;

  let pkg = "";
  if (P.formats?.length || P.engines?.length || P.validated?.length) {
    const chips = (arr, cls = "") => `<div class="chips">${arr.map((x) => `<span class="chip ${cls}">${esc(x)}</span>`).join("")}</div>`;
    pkg = (P.formats?.length ? `<div class="sub">${esc(T.formats)}</div>` + chips(P.formats) : "")
      + (P.engines?.length ? `<div class="sub">${esc(T.engines)}</div>` + chips(P.engines) : "")
      + (P.validated?.length ? `<div class="sub">${esc(T.validated)}</div>` + chips(P.validated, "ok") : "");
  }

  const det = document.getElementById("details");
  det.innerHTML = section("physics", T.physics, physics) + section("geometry", T.geometry, geometry) + section("hierarchy", T.hierarchy, hierarchy)
    + section("articulation", T.articulation, articulation, true) + section("pkg", T.pkg, pkg, true);
  det.addEventListener("click", (e) => { const h = e.target.closest("h2"); if (h) h.parentElement.classList.toggle("closed"); });
  det.addEventListener("pointerover", (e) => { const r = e.target.closest(".l"); if (r) hoverLink(r.dataset.link, true); });
  det.addEventListener("pointerout", (e) => { const r = e.target.closest(".l"); if (r) hoverLink(r.dataset.link, false); });
  function hoverLink(name, on) {
    const j = jointByLink[name];
    if (j) setHover(on ? j : null, false);
    else if (outline) { outline.selectedObjects = on ? linkMeshes(name) : []; outline.edgeStrength = 3; outline.edgeGlow = 0; }
    det.querySelectorAll(".l").forEach((r) => r.classList.toggle("hot", on && r.dataset.link === name));
    wake();
  }
}
window.__joints = movable;
window.__pick = pickJoint;
window.__outlineCount = () => outline ? outline.selectedObjects.length : -1;
window.__THREE = THREE;
</script>
