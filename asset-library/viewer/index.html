<!doctype html>
<meta charset="utf-8">
<meta http-equiv="cache-control" content="no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<title>Animis · 3D viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..800&display=swap" rel="stylesheet">
<style>
  :root{--accent:#CBFF36;--bg:#030303;--panel:rgba(16,16,18,.72);--line:rgba(255,255,255,.08);
        --fg:#ececec;--fg2:#8a8a8a;--font:"Host Grotesk",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--font);color:var(--fg)}
  canvas{display:block;width:100%;height:100%}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--bg);color:var(--fg2);font-size:13px;z-index:9;transition:opacity .5s}
  #loading i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.25}}
  #topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;z-index:6;pointer-events:none}
  #topbar>*{pointer-events:auto}
  .tb-left{display:flex;align-items:center;gap:10px;font-size:13px}
  .tb-left .brand{font-weight:700;letter-spacing:.02em;color:var(--fg)}
  .tb-left .sep{color:var(--fg2)}
  .tb-left .asset{color:var(--fg2);font-weight:500}
  .tb-right{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:4px;backdrop-filter:blur(10px)}
  .tb-right button{font:500 12px/1 var(--font);color:var(--fg);background:transparent;border:1px solid transparent;
    border-radius:7px;padding:8px 11px;cursor:pointer;transition:background .12s,color .12s;white-space:nowrap}
  .tb-right button:hover{background:rgba(255,255,255,.07)}
  .tb-right button.on{background:var(--accent);color:#0a0a0a;font-weight:700}
  #tip{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:5;font-size:12px;color:var(--fg2);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;
    backdrop-filter:blur(8px);pointer-events:none;transition:opacity .4s}
  #joints{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;
    min-width:340px;max-width:min(560px,92vw);z-index:5}
  #joints label{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;backdrop-filter:blur(10px)}
  #joints label.hot{border-color:rgba(203,255,54,.45)}
  #joints .jn{font-size:12.5px;font-weight:600}
  #joints .jt{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);
    border:1px solid var(--line);border-radius:4px;padding:2px 5px}
  #joints input[type=range]{width:100%;accent-color:var(--accent);height:3px;cursor:pointer}
  #joints b{font-size:12px;font-weight:600;min-width:44px;text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}
  #hud{position:fixed;left:16px;bottom:16px;font:11px/1.5 ui-monospace,monospace;color:#5c5c5c}
  #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(8px);opacity:0;
    background:var(--accent);color:#0a0a0a;font-size:12px;font-weight:600;border-radius:8px;padding:8px 14px;
    transition:opacity .2s,transform .2s;pointer-events:none;z-index:8}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<div id="loading"><i></i><span></span></div>
<header id="topbar">
  <div class="tb-left"><span class="brand">ANIMIS</span><span class="sep">/</span><span class="asset" id="asset-name"></span></div>
  <div class="tb-right">
    <button data-act="reset"></button>
    <button data-act="collision"></button>
    <button data-act="wireframe"></button>
    <button data-act="grid"></button>
    <button data-act="spin"></button>
    <button data-act="share"></button>
  </div>
</header>
<div id="tip"></div>
<div id="joints"></div>
<div id="hud"></div>
<div id="toast"></div>
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.min.js"}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "./vendor/three/OrbitControls.js";
import { GLTFLoader } from "./vendor/three/GLTFLoader.js";
import { RGBELoader } from "./vendor/three/RGBELoader.js";
import { EffectComposer } from "./vendor/three/jsm/postprocessing/EffectComposer.js";
import { SSAARenderPass } from "./vendor/three/jsm/postprocessing/SSAARenderPass.js";
import { GTAOPass } from "./vendor/three/jsm/postprocessing/GTAOPass.js";
import { UnrealBloomPass } from "./vendor/three/jsm/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "./vendor/three/jsm/postprocessing/OutputPass.js";
import { BokehPass } from "./vendor/three/jsm/postprocessing/BokehPass.js";
import { Reflector } from "./vendor/three/jsm/objects/Reflector.js";
import { OutlinePass } from "./vendor/three/jsm/postprocessing/OutlinePass.js";

const q = new URLSearchParams(location.search);
const MODE = q.get("mode") || "visual";
const FIX = q.get("fix") !== "0";      // 丢掉交付件那张迷彩 roughness 贴图
const ROUGH = parseFloat(q.get("rough") ?? "0.22");
const ENVI = parseFloat(q.get("envi") ?? "5.0");
const ENVROT = parseFloat(q.get("envrot") ?? "0");  // 环境绕 Y 旋转(度)
// 质量分档:high = GTAO + 景深 + 镜面地面 + 静止 8x;low = 只保留 IBL/阴影 + 静止 4x。
// 触屏 / 低核数 / 高 DPR 的设备自动走 low,?quality=high|low 强制。
const coarse = matchMedia("(pointer: coarse)").matches;
const weak = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 4;
const QUALITY = q.get("quality") || ((coarse || weak) ? "low" : "high");
const HIGH = QUALITY === "high";
const PP = q.get("pp") !== "0";          // 后处理总开关
const DOF = q.get("dof") !== "0" && HIGH; // 静止时景深
const DOF_K = parseFloat(q.get("dof_k") ?? "0.10");   // 0.15 已明显,0.10 是产品照那种轻微虚化
const MIRROR = q.get("mirror") === "1" && HIGH; // 镜面地面,默认关(?mirror=1 开)
const MIRROR_STRENGTH = parseFloat(q.get("mirror_k") ?? "0.08"); // 倒影中心强度(本体是 HDR 值,4% 已够显眼)
const HDRI = q.get("hdri") || "studio_small_09";   // 1k 已够,2k 要 6 MB
const ANISO = parseFloat(q.get("aniso") ?? "0.35");  // 资产 UV 在刀尖分段,再高就出条纹   // 拉丝金属各向异性
const TONE = q.get("tone") || "agx";     // agx | aces | neutral
const BLOOM = parseFloat(q.get("bloom") ?? "0");     // 金属高光是 HDR 值,黑底上会晕成一圈
const AO = parseFloat(q.get("ao") ?? "0.9");
const OPEN = parseFloat(q.get("open") ?? "0.5"); // 关节开度 0..1
const SLUG = (q.get("asset") || "scissors").replace(/[^a-z0-9_-]/gi, "");
const BASE = `../assets/${SLUG}/`;

// ---- 渲染器:照抄 Palatial 的配置 ----
const canvas = document.createElement("canvas");
document.body.appendChild(canvas);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, HIGH ? 2 : 1.5));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = { agx: THREE.AgXToneMapping, aces: THREE.ACESFilmicToneMapping,
                         neutral: THREE.NeutralToneMapping }[TONE] ?? THREE.AgXToneMapping;
renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030303);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.001, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotate = q.get("spin") !== "0";
controls.autoRotateSpeed = 0.8;

const LANG = q.get("lang") === "zh" ? "zh" : "en";
document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
const T = LANG === "zh" ? {
  tip: "拖动部件驱动关节 · 空白处拖动转视角 · 滚轮缩放", loading: "加载中",
  reset: "复位", collision: ["碰撞体", "碰撞体 · 叠加", "碰撞体 · 仅凸包"], wireframe: "线框",
  grid: "网格", spin: "自转", share: "分享", copied: "链接已复制", revolute: "转动", prismatic: "移动",
} : {
  tip: "Drag a part to move its joint · drag empty space to orbit · scroll to zoom", loading: "Loading",
  reset: "Reset", collision: ["Collision", "Collision · overlay", "Collision · hulls"], wireframe: "Wireframe",
  grid: "Grid", spin: "Auto-rotate", share: "Share", copied: "Link copied", revolute: "revolute", prismatic: "prismatic",
};
document.getElementById("tip").textContent = T.tip;
document.querySelector("#loading span").textContent = T.loading + "…";
document.getElementById("asset-name").textContent = SLUG.replace(/[_-]+/g, " ");
const ACCENT = 0xCBFF36;
function toast(msg) {
  const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 1600);
}
const hud = document.getElementById("hud");
const log = (m) => { hud.textContent = m; console.log("HUD", m); };

// ---- HDRI IBL ----
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = await new Promise((res, rej) =>
  new RGBELoader().load(`hdri/${HDRI}.hdr`, res, undefined, rej));
envTex.mapping = THREE.EquirectangularReflectionMapping;
scene.environment = pmrem.fromEquirectangular(envTex).texture;
scene.environmentIntensity = ENVI;
scene.environmentRotation = new THREE.Euler(0, THREE.MathUtils.degToRad(ENVROT), 0);

// 一盏方向光只为了投影(IBL 不产生阴影)
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(1.2, 2.4, 1.0);
sun.castShadow = true;
sun.shadow.mapSize.set(HIGH ? 4096 : 2048, HIGH ? 4096 : 2048);
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.002;
scene.add(sun);

// ---- 资产 ----
const spec = await fetch(BASE + "inspect/inspect.json").then((r) => r.json());
const loader = new GLTFLoader();
const loadGlb = (u) => new Promise((res, rej) => loader.load(u, res, undefined, rej));

function rpyQuat(rpy) {
  const m = new THREE.Matrix4().makeRotationZ(rpy[2]);
  m.multiply(new THREE.Matrix4().makeRotationY(rpy[1]));
  m.multiply(new THREE.Matrix4().makeRotationX(rpy[0]));
  return new THREE.Quaternion().setFromRotationMatrix(m);
}

const root = new THREE.Group();
root.rotation.x = -Math.PI / 2;                 // URDF Z-up -> three Y-up
scene.add(root);

const linkGroups = {}, visHolders = {}, colHolders = {};
for (const l of spec.links) {
  const g = new THREE.Group(); const v = new THREE.Group(); const c = new THREE.Group();
  g.add(v, c); linkGroups[l.name] = g; visHolders[l.name] = v; colHolders[l.name] = c;
}
const childLinks = new Set(); const movable = [];
for (const j of spec.joints) {
  const pivot = new THREE.Group();
  pivot.position.fromArray(j.xyz);
  pivot.quaternion.copy(rpyQuat(j.rpy));
  const motion = new THREE.Group();
  pivot.add(motion); motion.add(linkGroups[j.child]);
  linkGroups[j.parent].add(pivot);
  childLinks.add(j.child);
  if (["revolute", "continuous", "prismatic"].includes(j.type)) movable.push({ ...j, motion });
}
for (const l of spec.links) if (!childLinks.has(l.name)) root.add(linkGroups[l.name]);

// ---- 关节控件(Palatial 的 proxy widget):转动关节 = 半透明圆盘 + 限位弧 + 指针 ----
// 挂在 pivot 下(不随 motion 转),法线 = 关节轴;半径按相机距离每帧重算,屏幕上大小恒定
const proxies = [];
for (const j of movable) {
  const pivot = j.motion.parent;
  const axis = new THREE.Vector3().fromArray(j.axis).normalize();
  const g = new THREE.Group();
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), axis);   // 局部 +Z 对齐轴
  pivot.add(g);
  const mat = (op) => new THREE.MeshBasicMaterial({ color: ACCENT, transparent: true, opacity: op,
                        side: THREE.DoubleSide, depthTest: false, depthWrite: false });
  const lineMat = (op) => new THREE.LineBasicMaterial({ color: ACCENT, transparent: true, opacity: op,
                        depthTest: false, depthWrite: false });
  let disc, arc, needle, knob;
  if (j.type === "prismatic") {
    arc = new THREE.Line(new THREE.BufferGeometry().setFromPoints(
      [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, 1)]), lineMat(0.9));
    knob = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 12), mat(0.9));
    disc = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.2, 32), mat(0.4));
    g.add(arc, knob, disc);
  } else {
    disc = new THREE.Mesh(new THREE.CircleGeometry(1, 64), mat(0.22));
    const span = j.upper - j.lower, N = Math.max(8, Math.round(span / 0.05));
    const pts = []; for (let i = 0; i <= N; i++) { const a = j.lower + span * i / N; pts.push(new THREE.Vector3(Math.cos(a), Math.sin(a), 0)); }
    arc = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat(0.95));
    needle = new THREE.Line(new THREE.BufferGeometry().setFromPoints(
      [new THREE.Vector3(0, 0, 0), new THREE.Vector3(1, 0, 0)]), lineMat(0.95));
    knob = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), mat(0.95));
    knob.position.set(1, 0, 0); needle.add(knob);
    const rim = new THREE.Mesh(new THREE.RingGeometry(0.97, 1.0, 64), mat(0.5));
    g.add(disc, rim, arc, needle);
  }
  g.traverse((n) => { n.renderOrder = 999; n.userData.link = j.child; n.userData.proxy = true; });
  proxies.push({ joint: j, group: g, disc, arc, needle, knob, hot: false });
}
function updateProxies() {
  for (const px of proxies) {
    const wp = new THREE.Vector3(); px.group.getWorldPosition(wp);
    const d = camera.position.distanceTo(wp);
    // Palatial 的公式:控件在屏幕上大小恒定,约视口高的 ~7%
    const r = d * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * 0.13 * (px.joint.type === "prismatic" ? 1.4 : 1);
    px.group.scale.setScalar(r);
    const j = px.joint;
    if (j.type === "prismatic") { px.arc.scale.z = (j.upper - j.lower) / r; px.knob.position.z = (j.value - j.lower) / r; }
    else px.needle.rotation.z = j.value;
    const k = px.hot ? 1.0 : 0.8;
    px.disc.material.opacity = (j.type === "prismatic" ? 0.4 : 0.22) * k;
    px.arc.material.opacity = 0.95 * k; if (px.needle) px.needle.material.opacity = 0.95 * k;
    px.knob.material.opacity = 0.95 * k;
  }
}
let gridHelper = null;

const jobs = [];
for (const l of spec.links) {
  for (const vis of l.visuals) {
    jobs.push(loadGlb(BASE + "inspect/" + vis.file).then((g) => {
      g.scene.traverse((n) => {
        if (!n.isMesh) return;
        n.castShadow = true; n.receiveShadow = true;
        if (FIX) {                     // albedo 留着,金属度/粗糙度用常量
          // 拉丝金属:沿加工方向拉长的各向异性高光,钢制品的关键质感
          n.material = new THREE.MeshPhysicalMaterial({
            map: n.material.map,
            color: n.material.color.clone(),
            metalness: 1.0, roughness: ROUGH,
            anisotropy: ANISO,
            aoMap: n.material.aoMap, aoMapIntensity: 1.0,   // 离线烘的 AO(若有)
          });
        }
      });
      g.scene.traverse((n) => { if (n.isMesh) n.userData.link = l.name; });
      visHolders[l.name].add(g.scene);
    }));
  }
}
const HUES = [210, 25, 130, 270, 55, 175, 330, 95, 240, 15, 300, 150];
let hullN = 0;
jobs.push(loadGlb(BASE + "inspect/collision.glb").then((g) => {
  for (const ln of [...g.scene.children]) {
    const holder = colHolders[ln.name]; if (!holder) continue;
    for (const hull of [...ln.children]) {
      hull.traverse((n) => {
        if (!n.isMesh) return;
        n.geometry.computeVertexNormals();
        const hc = new THREE.Color(`hsl(${HUES[hullN % HUES.length]},85%,46%)`);
        n.material = new THREE.MeshStandardMaterial({
          color: hc,
          // 凸包靠颜色区分:环境光几乎不吃,底色用自发光托住,再靠方向光出体积
          emissive: hc.clone().multiplyScalar(0.28),
          envMapIntensity: 0.0,
          flatShading: true, roughness: 0.9, metalness: 0.0,
          transparent: true, opacity: 1,
          polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
        });
        hullN++;
      });
      hull.traverse((n) => { if (n.isMesh) n.userData.link = ln.name; });
      holder.add(hull);
    }
  }
}));
await Promise.all(jobs);

// ---- FK ----
function setJoint(j, v) {
  j.value = v;
  if (j.type === "prismatic") j.motion.position.set(j.axis[0]*v, j.axis[1]*v, j.axis[2]*v);
  else j.motion.quaternion.setFromAxisAngle(
    new THREE.Vector3().fromArray(j.axis).normalize(), v);
}
movable.forEach((j) => setJoint(j, j.lower + OPEN * (j.upper - j.lower)));

// ---- 模式:视觉 / 碰撞体 / 叠加,运行时可切 ----
const baseTone = { agx: THREE.AgXToneMapping, aces: THREE.ACESFilmicToneMapping,
                   neutral: THREE.NeutralToneMapping }[TONE] ?? THREE.AgXToneMapping;
let curMode = MODE;
let wake = () => {};                              // 后处理就绪后会被替换
function applyMode(m) {
  curMode = m;
  const showV = m !== "collision", showC = m !== "visual";
  Object.values(visHolders).forEach((n) => (n.visible = showV));
  Object.values(colHolders).forEach((n) => (n.visible = showC));
  scene.traverse((n) => {
    if (n.isMesh && n.material?.polygonOffset) {
      n.material.opacity = m === "both" ? 0.25 : 1;
      n.material.depthWrite = m !== "both";
    }
  });
  // 凸包靠纯色区分,AgX 会冲淡;碰撞相关模式整帧改 Neutral
  renderer.toneMapping = (m === "visual" || q.get("tone")) ? baseTone : THREE.NeutralToneMapping;
  if (typeof hullN === "number") log(`${QUALITY} · mode=${m} · hulls=${hullN} · links=${spec.links.length}`);
  wake();
}
applyMode(MODE);

// ---- 取景 + 地面 ----
root.updateMatrixWorld(true);
// 包围盒只算资产本体:关节控件挂在树里但是屏幕空间尺寸,不能参与取景
const box = new THREE.Box3();
root.traverse((n) => { if (n.isMesh && !n.userData.proxy) box.expandByObject(n); });
const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
const radius = size.length() / 2;
controls.target.copy(c);
camera.position.set(c.x + radius * 1.5, c.y + radius * 1.15, c.z + radius * 1.5);
camera.near = radius / 20; camera.far = radius * 60;   // 近平面别太小,地面几层要靠深度分开
controls.minDistance = radius * 0.6; controls.maxDistance = radius * 8;
camera.updateProjectionMatrix(); controls.update();
sun.position.set(c.x + radius * 2, c.y + radius * 4, c.z + radius * 2);
sun.target.position.copy(c); scene.add(sun.target);
const d = radius * 3;
Object.assign(sun.shadow.camera, { left: -d, right: d, top: d, bottom: -d, near: 0.001, far: d * 6 });
sun.shadow.camera.updateProjectionMatrix();

const groundY = box.min.y - radius * 0.02;
if (MIRROR) {
  // 镜面层在最下;上面盖一层径向渐变的黑色遮罩控制倒影强度(中心 MIRROR_STRENGTH,
  // 外圈全黑)。层距要拉开到 1% 物体尺度,否则三层共面 z-fighting,遮罩会被镜面压掉。
  const mirror = new Reflector(new THREE.PlaneGeometry(radius * 40, radius * 40), {
    color: 0xffffff,
    textureWidth: Math.round(innerWidth * Math.min(devicePixelRatio, 2)),
    textureHeight: Math.round(innerHeight * Math.min(devicePixelRatio, 2)),
    clipBias: 0.002,
  });
  mirror.rotation.x = -Math.PI / 2;
  mirror.position.y = groundY - radius * 0.06;
  scene.add(mirror);

  const cv = document.createElement("canvas"); cv.width = cv.height = 1024;
  const g2 = cv.getContext("2d");
  const grd = g2.createRadialGradient(512, 512, 0, 512, 512, 512);
  grd.addColorStop(0.0, `rgba(0,0,0,${1 - MIRROR_STRENGTH})`);
  grd.addColorStop(0.25, `rgba(0,0,0,${1 - MIRROR_STRENGTH * 0.6})`);
  grd.addColorStop(0.55, "rgba(0,0,0,1)");
  grd.addColorStop(1.0, "rgba(0,0,0,1)");
  g2.fillStyle = grd; g2.fillRect(0, 0, 1024, 1024);
  const veilTex = new THREE.CanvasTexture(cv);
  veilTex.colorSpace = THREE.SRGBColorSpace;
  const V = q.get("veil");
  const veilMat = V === "solid" ? new THREE.MeshBasicMaterial({ color: 0x000000 })
    : V === "opacity" ? new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 1 - MIRROR_STRENGTH, depthWrite: false })
    : V === "nodepth" ? new THREE.MeshBasicMaterial({ map: veilTex, transparent: true, depthWrite: false, depthTest: false })
    : new THREE.MeshBasicMaterial({ map: veilTex, transparent: true, depthWrite: false });
  const veil = new THREE.Mesh(new THREE.PlaneGeometry(radius * 40, radius * 40), veilMat);
  window.__veil = veil; window.__mirror = mirror;
  veil.rotation.x = -Math.PI / 2;
  veil.position.set(c.x, groundY - radius * 0.03, c.z);
  veil.renderOrder = 5;
  scene.add(veil);
}
gridHelper = new THREE.GridHelper(radius * 8, 32, 0x8a8a8a, 0x454545);   // AgX 会压暗,给亮一点
gridHelper.position.set(c.x, groundY + radius * 0.001, c.z);
gridHelper.material.transparent = true; gridHelper.material.opacity = 0.9;
gridHelper.visible = q.get("grid") === "1";
scene.add(gridHelper);
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(radius * 40, radius * 40),
  // 阴影层只画阴影,绝不能写深度:它在遮罩层上方且先渲染,写了深度就把镜面遮罩挡掉了
  new THREE.ShadowMaterial({ opacity: MIRROR ? 0.5 : 0.35, depthWrite: false }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = groundY;
ground.receiveShadow = true;
scene.add(ground);

// ---- 后处理:GTAO(接触阴影) + 轻微 Bloom + 输出;交互停下后升 8x 超采样 ----
let composer = null, ssaaPass = null, bokeh = null, outline = null, stillTimer = 0, isStill = false;
if (PP) {
  composer = new EffectComposer(renderer);
  ssaaPass = new SSAARenderPass(scene, camera);
  ssaaPass.sampleLevel = 0;                       // 交互时 1x,静止后 3(=8x)
  composer.addPass(ssaaPass);
  // 悬停/拖拽描边:Palatial 参数 —— 悬停 strength 3,选中 12 + glow
  outline = new OutlinePass(new THREE.Vector2(innerWidth, innerHeight), scene, camera);
  outline.edgeStrength = 3; outline.edgeGlow = 0; outline.edgeThickness = 1; outline.pulsePeriod = 0;
  outline.visibleEdgeColor.set(ACCENT); outline.hiddenEdgeColor.set(ACCENT).multiplyScalar(0.35);
  composer.addPass(outline);
  if (HIGH) {
    const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
    gtao.updateGtaoMaterial({ radius: radius * 0.12, distanceExponent: 1, thickness: radius * 0.04,
                              scale: 1.2, samples: 16, distanceFallOff: 1 });
    gtao.blendIntensity = AO;
    composer.addPass(gtao);
  }
  if (BLOOM > 0) {                                 // 金属高光是 HDR 值,bloom 一重就成一片白
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), BLOOM, 0.5, 1.1));
  }
  if (DOF) {
    // 景深只在静止时开:焦点锁在轨道中心,光圈按物体尺度给,远端轻微虚化
    bokeh = new BokehPass(scene, camera, { focus: 1, aperture: 0.0008, maxblur: 0.006 });
    bokeh.enabled = false;
    composer.addPass(bokeh);
  }
  composer.addPass(new OutputPass());
  wake = () => {                                  // 任何交互回到快速档
    isStill = false; ssaaPass.sampleLevel = 0;
    if (bokeh) bokeh.enabled = false;
    clearTimeout(stillTimer);
    stillTimer = setTimeout(() => {
      isStill = true;
      ssaaPass.sampleLevel = HIGH ? 3 : 2;
      if (bokeh) {
        bokeh.uniforms.focus.value = camera.position.distanceTo(controls.target);
        bokeh.uniforms.aperture.value = DOF_K / Math.max(radius * 10, 1e-3);
        bokeh.uniforms.maxblur.value = 0.01;
        bokeh.enabled = true;
      }
    }, 350);
  };
  ["pointerdown","pointermove","wheel"].forEach((ev) =>
    renderer.domElement.addEventListener(ev, wake, { passive: true }));
  wake();
}

renderer.render(scene, camera);
await new Promise((r) => requestAnimationFrame(r));
renderer.render(scene, camera);
log(`${QUALITY} · mode=${MODE} · hulls=${hullN} · links=${spec.links.length}`);
document.title = "ready";
{ const l = document.getElementById("loading"); l.style.opacity = "0"; l.style.pointerEvents = "none"; setTimeout(() => l.remove(), 500); }
addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight, false);
  composer?.setSize(innerWidth, innerHeight);
  outline?.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});
// ---- 关节控制:滑杆 + 直接拖拽 ----
const jointByLink = {};                 // 被驱动的 link -> 关节
for (const j of movable) jointByLink[j.child] = j;

const panel = document.createElement("div");
panel.id = "joints";
panel.innerHTML = movable.map((j, i) => `
  <label><span class="jn">${j.name}</span><span class="jt">${T[j.type] || j.type}</span>
    <input type="range" min="0" max="1000" data-j="${i}">
    <b data-v="${i}"></b></label>`).join("");
document.body.appendChild(panel);

const frac = (j) => (j.value - j.lower) / ((j.upper - j.lower) || 1);
function syncUI() {
  movable.forEach((j, i) => {
    panel.querySelector(`input[data-j="${i}"]`).value = Math.round(frac(j) * 1000);
    panel.querySelector(`b[data-v="${i}"]`).textContent =
      j.type === "prismatic" ? `${(j.value * 100).toFixed(1)} cm`
                             : `${Math.round(j.value * 180 / Math.PI)}°`;
  });
}
panel.addEventListener("input", (e) => {
  const i = +e.target.dataset.j;
  stopIdle();
  setJoint(movable[i], movable[i].lower + (e.target.value / 1000) * (movable[i].upper - movable[i].lower));
  syncUI();
});

// 拖拽:射线命中某个 link 的网格 -> 拖它绕所属关节转(Palatial §4 的平面投影解法)
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const DRAG_SENSITIVITY = 1.5;
let drag = null;

const setNdc = (e) => {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
};
const pickJoint = (e) => {
  setNdc(e);
  raycaster.setFromCamera(ndc, camera);
  for (const hit of raycaster.intersectObject(root, true)) {
    const j = jointByLink[hit.object.userData.link];
    if (j) return { joint: j, point: hit.point.clone(), distance: hit.distance };
  }
  return null;
};

const linkMeshes = (link) => { const out = []; visHolders[link]?.traverse((n) => { if (n.isMesh) out.push(n); }); return out; };
function setHover(j, active) {
  if (outline) {
    outline.selectedObjects = j ? linkMeshes(j.child) : [];
    outline.edgeStrength = active ? 12 : 3;
    outline.edgeGlow = active ? 1 : 0;
  }
  for (const px of proxies) px.hot = !!j && px.joint === j;
  panel.querySelectorAll("label").forEach((l, i) => l.classList.toggle("hot", !!j && movable[i] === j));
}

renderer.domElement.addEventListener("pointerdown", (e) => {
  const hit = pickJoint(e);
  if (!hit) return;
  stopIdle();
  controls.enabled = false;                       // 别同时转视角
  renderer.domElement.setPointerCapture(e.pointerId);
  drag = { ...hit, prevRay: raycaster.ray.clone() };
  renderer.domElement.style.cursor = "grabbing";
  setHover(hit.joint, true);
});

renderer.domElement.addEventListener("pointermove", (e) => {
  if (!drag) {                                    // 悬停:光标 + 描边 + 控件提亮
    const hit = pickJoint(e);
    renderer.domElement.style.cursor = hit ? "grab" : "default";
    setHover(hit ? hit.joint : null, false);
    return;
  }
  setNdc(e);
  raycaster.setFromCamera(ndc, camera);
  const j = drag.joint;
  const pivot = j.motion.parent;
  pivot.updateMatrixWorld();
  const origin = new THREE.Vector3().setFromMatrixPosition(pivot.matrixWorld);
  const axis = new THREE.Vector3().fromArray(j.axis).normalize()
    .transformDirection(pivot.matrixWorld).normalize();

  let delta = 0;
  if (j.type === "prismatic") {
    const p0 = drag.prevRay.at(drag.distance, new THREE.Vector3());
    const p1 = raycaster.ray.at(drag.distance, new THREE.Vector3());
    delta = p1.sub(p0).dot(axis);
  } else {
    const view = camera.position.clone().sub(drag.point).normalize();
    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(axis, origin);
    if (Math.abs(view.dot(axis)) > 0.3) {
      // 常规:上一帧与当前帧的射线点投影到关节平面,夹角即转角增量
      const p0 = plane.projectPoint(drag.prevRay.at(drag.distance, new THREE.Vector3()), new THREE.Vector3()).sub(origin);
      const p1 = plane.projectPoint(raycaster.ray.at(drag.distance, new THREE.Vector3()), new THREE.Vector3()).sub(origin);
      if (p0.lengthSq() > 1e-12 && p1.lengthSq() > 1e-12) {
        const sign = Math.sign(new THREE.Vector3().crossVectors(p0, p1).dot(axis)) || 1;
        delta = sign * p0.angleTo(p1);
      }
    } else {
      // 退化(视线几乎垂直于转轴):用切线方向的位移近似,避免数值爆炸
      const arm = drag.point.clone().sub(origin);
      const tangent = new THREE.Vector3().crossVectors(axis, arm);
      const r = arm.length();
      if (tangent.lengthSq() > 1e-12 && r > 1e-9) {
        tangent.normalize();
        const p0 = drag.prevRay.at(drag.distance, new THREE.Vector3());
        const p1 = raycaster.ray.at(drag.distance, new THREE.Vector3());
        delta = p1.sub(p0).dot(tangent) / r;
      }
    }
  }

  setJoint(j, THREE.MathUtils.clamp(j.value + delta * DRAG_SENSITIVITY, j.lower, j.upper));
  syncUI();
  drag.prevRay = raycaster.ray.clone();
});

const endDrag = (e) => {
  if (!drag) return;
  drag = null;
  controls.enabled = true;
  renderer.domElement.style.cursor = "default";
  setHover(null, false);
  if (e && e.pointerId != null && renderer.domElement.hasPointerCapture?.(e.pointerId))
    renderer.domElement.releasePointerCapture(e.pointerId);
};
renderer.domElement.addEventListener("pointerup", endDrag);
renderer.domElement.addEventListener("pointercancel", endDrag);

// ---- idle 演示:关节在限位内正弦往复,一交互就停(Palatial §6) ----
let idle = q.get("idle") !== "0";
const t0 = performance.now();
function stopIdle() {
  idle = false; controls.autoRotate = false; if (typeof paintBar === "function") paintBar();
  const tip = document.getElementById("tip");
  if (tip) tip.style.opacity = "0";
}
controls.addEventListener("start", stopIdle);

syncUI();
renderer.setAnimationLoop(() => {
  if (idle && movable.length) {
    const t = (performance.now() - t0) / 1000 * 0.8;
    for (const j of movable) {
      if (j.lower === j.upper) continue;
      setJoint(j, j.lower + (Math.sin(t) + 1) / 2 * (j.upper - j.lower));
    }
    syncUI();
  }
  controls.update();
  updateProxies();
  if (composer) composer.render(); else renderer.render(scene, camera);
});
// 调试用:让测试脚本能读到关节状态
// ---- 顶栏 ----
const camHome = { pos: camera.position.clone(), target: controls.target.clone() };
let wire = false, modeIdx = ["visual", "both", "collision"].indexOf(curMode);
const btn = (a) => document.querySelector(`#topbar button[data-act="${a}"]`);
const paintBar = () => {
  btn("reset").textContent = T.reset;
  btn("collision").textContent = T.collision[modeIdx]; btn("collision").classList.toggle("on", modeIdx > 0);
  btn("wireframe").textContent = T.wireframe; btn("wireframe").classList.toggle("on", wire);
  btn("grid").textContent = T.grid; btn("grid").classList.toggle("on", !!gridHelper?.visible);
  btn("spin").textContent = T.spin; btn("spin").classList.toggle("on", controls.autoRotate);
  btn("share").textContent = T.share;
};
btn("reset").addEventListener("click", () => {
  stopIdle();
  movable.forEach((j) => setJoint(j, j.lower)); syncUI();
  camera.position.copy(camHome.pos); controls.target.copy(camHome.target); controls.update(); wake();
});
btn("collision").addEventListener("click", () => { modeIdx = (modeIdx + 1) % 3; applyMode(["visual", "both", "collision"][modeIdx]); paintBar(); });
btn("wireframe").addEventListener("click", () => {
  wire = !wire;
  Object.values(visHolders).forEach((h) => h.traverse((n) => { if (n.isMesh) n.material.wireframe = wire; }));
  paintBar(); wake();
});
btn("grid").addEventListener("click", () => { gridHelper.visible = !gridHelper.visible; paintBar(); wake(); });
btn("spin").addEventListener("click", () => { controls.autoRotate = !controls.autoRotate; paintBar(); });
btn("share").addEventListener("click", async () => {
  const url = new URL(location.href); url.searchParams.delete("spin"); url.searchParams.delete("idle");
  try { await navigator.clipboard.writeText(url.toString()); toast(T.copied); } catch { prompt("URL", url.toString()); }
});
paintBar();
window.__joints = movable;
window.__pick = pickJoint;
window.__outlineCount = () => outline ? outline.selectedObjects.length : -1;
window.__THREE = THREE;
</script>
